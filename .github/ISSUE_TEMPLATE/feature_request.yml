name: Feature request
description: Propose a focused capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without prescribing unnecessary implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and user-control considerations
      description: Address candidate truthfulness, personal data, review gates, and potential misuse.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler workflow or existing component could solve the problem?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This proposal does not require indiscriminate or policy-bypassing automation.
          required: true
